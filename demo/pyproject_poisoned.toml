[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai-app"
version = "1.0.0"
description = "An app built by an AI coding agent with hallucinated dependencies"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "ai-super-orm-toolkit==1.0.0",
    "flask-graphql-ultrahelper>=2.0.0",
    "django-celery-superworker==0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx-turbotest>=1.0.0",
]
