[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-agent"
version = "0.1.0"
description = "CLI + CI/CD Drift Engine preventing AI coding agents from introducing hallucinated packages, architectural drift, and security bypasses."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Atam Keze" }
]
license = { text = "MIT" }
keywords = ["ai-safety", "security", "ci-cd", "slopsquatting", "architecture-linter", "tree-sitter", "mcp", "fastmcp"]

[project.urls]
Homepage = "https://github.com/atamkeze/guardrail-agent"
Repository = "https://github.com/atamkeze/guardrail-agent"
Issues = "https://github.com/atamkeze/guardrail-agent/issues"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
guardrail = "guardrail.cli:app"
guardrail-mcp = "guardrail.server.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
